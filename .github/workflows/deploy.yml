name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      # SITE_URL and ALLOW_INDEXING are repository variables (Settings → Secrets and
      # variables → Actions → Variables); unset, the site deploys as a noindex preview.
      # See DEPLOYMENT.md.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ vars.SITE_URL }}
          ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the repository's Pages source is "Deploy from a branch", GitHub also builds
      # the README into a page on every push ("pages build and deployment"), and whichever
      # deploy finishes last stays live. Wait for that one (at most five minutes), so the
      # site always goes out last. With the source set to "GitHub Actions" there is none.
      - name: Wait for GitHub's own Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=dynamic" --jq '[.workflow_runs[] | select(.status != "completed")] | length' || echo 0)
            [ "$pending" = "0" ] && break
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
