<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Asset lab</title>
<style>html,body{margin:0;height:100%;background:#dfe5e4}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
// Development aid: shows the CC0 models side by side to check scale, parts and clips.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdfe5e4);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667766, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(-4, 8, 6); scene.add(sun);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
const view = new URLSearchParams(location.search).get("view") || "vehicles";
const loader = new GLTFLoader();
const load = (url) => new Promise((r, j) => loader.load(url, r, undefined, j));
const info = {};
if (view === "vehicles") {
  cam.position.set(-5.5, 4, -7); cam.lookAt(0, 0.6, 0);
  const van = (await load("assets/models/vehicles/van.glb")).scene; van.position.x = -1.2; scene.add(van);
  const del = (await load("assets/models/vehicles/delivery.glb")).scene; del.position.x = 1.4; scene.add(del);
  const door = del.getObjectByName("door"); door.rotation.x = -1.4;
  info.van = new THREE.Box3().setFromObject(van).getSize(new THREE.Vector3());
  info.delivery = new THREE.Box3().setFromObject(del).getSize(new THREE.Vector3());
} else if (view === "humans") {
  cam.position.set(0, 1.3, 6.5); cam.lookAt(0, 0.9, 0);
  const files = ["worker", "animated-human", "man"];
  info.sizes = {}; info.bones = {};
  for (let i = 0; i < files.length; i++) {
    const g = await load(`assets/_downloads/polypizza/${files[i]}.glb`);
    const m = g.scene; scene.add(m);
    const mixer = new THREE.AnimationMixer(m);
    const walk = g.animations.find((a) => /walk/i.test(a.name));
    mixer.clipAction(walk).play(); mixer.setTime(walk.duration * 0.25);
    m.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(m, true); const size = box.getSize(new THREE.Vector3());
    const s = 1.8 / size.y; m.scale.setScalar(s); m.position.x = (i - 1) * 1.6; m.rotation.y = 0.6;
    info.sizes[files[i]] = size.toArray().map((v) => +v.toFixed(3));
    const bones = []; m.traverse((o) => { if (o.isBone) bones.push(o.name); });
    info.bones[files[i]] = bones.join(",");
  }
} else {
  cam.position.set(0, 1.4, 4.2); cam.lookAt(0, 0.4, 0);
  const clips = ["idle", "walk", "pick-up", "holding-both", "interact-right", "drive"];
  const gltf = await load("assets/models/characters/character-male-a.glb");
  info.clips = gltf.animations.map((a) => `${a.name}:${a.duration.toFixed(2)}`);
  for (let i = 0; i < clips.length; i++) {
    const g = await load("assets/models/characters/character-male-a.glb");
    const m = g.scene; m.position.x = (i - 2.5) * 0.9; m.rotation.y = 0.5; scene.add(m);
    const mixer = new THREE.AnimationMixer(m);
    const clip = g.animations.find((a) => a.name === clips[i]);
    const act = mixer.clipAction(clip); act.play(); mixer.setTime(clip.duration * 0.3);
  }
}
renderer.render(scene, cam);
window.__info = info; document.title = "ready";
</script>
</body>
</html>
